name: Refresh data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Google Sheets
        id: sheet
        continue-on-error: true
        run: node scripts/sync-data.cjs
      - name: Save refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Google Sheets data'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp *.html *.css *.js *.png *.jpg *.txt _site/
          cp -r fonts data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow uploaded artifact to become available
        run: sleep 10
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry deployment
        if: steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v4
      - name: Summarize publication
        if: always()
        env:
          READ_RESULT: ${{ steps.sheet.outcome }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
          RETRY_RESULT: ${{ steps.retry.outcome }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ] || [ "$RETRY_RESULT" = "success" ]; then
            echo "### เผยแพร่เว็บ: สำเร็จ" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### เผยแพร่เว็บ: ไม่สำเร็จ" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$READ_RESULT" != "success" ]; then
            echo "เผยแพร่ข้อมูลเดิมพร้อมสถานะอ่านชีตไม่สำเร็จ" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
